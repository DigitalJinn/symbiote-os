version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./config/caddy_data:/data
      - ./config/caddy_config:/config
    networks:
      - symbiote_net
    command: caddy run --config /etc/caddy/Caddyfile

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-symbiote}
      - WEBHOOK_URL=http://localhost:5678
      - DB_TYPE=sqlite
      - EXECUTIONS_PROCESS=main
      - N8N_ENFORCE_TRUST_PROXY_HEADER=true
    volumes:
      - ./config/n8n_data:/home/node/.n8n
    networks:
      - symbiote_net
    depends_on:
      - caddy

  nextcloud:
    image: nextcloud:28-apache
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    environment:
      - MYSQL_HOST=db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-change-me}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD:-change-me}
      - TRUSTED_DOMAINS=localhost 127.0.0.1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./config/nextcloud_data:/var/www/html
      - ./workspace:/var/www/html/workspace
    networks:
      - symbiote_net
    depends_on:
      - db
      - redis

  db:
    image: mariadb:11
    container_name: nextcloud_db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW --innodb-file-format=Barracuda
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-change-me}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-change-me}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
    volumes:
      - ./config/nextcloud_db/mysql:/var/lib/mysql
    networks:
      - symbiote_net

  redis:
    image: redis:7-alpine
    container_name: symbiote_redis
    restart: unless-stopped
    networks:
      - symbiote_net
    command: redis-server --appendonly yes

  collabora:
    image: collabora/code:latest
    container_name: collabora
    restart: unless-stopped
    ports:
      - "127.0.0.1:9980:9980"
    environment:
      - ALIASGROUP1=https://localhost
      - DONT_GEN_SSL_CERT=true
      - server_name=collabora.local
    cap_add:
      - MKNOD
    mem_limit: 512m
    networks:
      - symbiote_net

  appflowy:
    image: appflowy/appflowy:latest
    container_name: appflowy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - FLUTTER_TARGET=web
      - APPFLOWY_MODE=production
    volumes:
      - ./config/appflowy:/home/appflowy
    mem_limit: 1g
    networks:
      - symbiote_net

  affine:
    image: ghcr.io/toeverything/affine:latest
    container_name: affine
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3010"
    environment:
      - DATABASE_URL=postgresql://affine:${AFFINE_DB_PASSWORD:-change-me}@postgres_affine:5432/affine
      - AFFINE_SERVER_HOST=0.0.0.0
      - AFFINE_SERVER_PORT=3010
    depends_on:
      - postgres_affine
    volumes:
      - ./config/affine:/app/storage
    mem_limit: 1g
    networks:
      - symbiote_net

  postgres_affine:
    image: postgres:15-alpine
    container_name: postgres_affine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=affine
      - POSTGRES_USER=affine
      - POSTGRES_PASSWORD=${AFFINE_DB_PASSWORD:-change-me}
    volumes:
      - ./config/postgres_affine:/var/lib/postgresql/data
    mem_limit: 512m
    networks:
      - symbiote_net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_KEEP_ALIVE=5m
    volumes:
      - ./config/ollama:/root/.ollama
    mem_limit: 7g
    networks:
      - symbiote_net

  tor:
    image: osminogin/tor-simple:latest
    container_name: tendril_tor
    restart: unless-stopped
    ports:
      - "9050:9050"
      - "9051:9051"
    volumes:
      - ./config/tor:/var/lib/tor
    networks:
      - symbiote_net

networks:
  symbiote_net:
    driver: bridge
